<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}</style><rect x="0" y="0" width="1080" height="1440" fill="#f6f4ed" stroke="none" stroke-width="2"/><text x="72" y="100" font-size="28" fill="#69705f" font-weight="400">MCD WATCH / 麦麦不忘</text><text x="72" y="270" font-size="88" fill="#20231e" font-weight="700">把麦当劳活动</text><text x="72" y="390" font-size="88" fill="#20231e" font-weight="700">放进你的日历。</text><rect x="72" y="445" width="680" height="18" fill="#ffda35" stroke="none" stroke-width="2"/><text x="72" y="535" font-size="42" fill="#20231e" font-weight="400">早餐 / 咖啡 / 联名周边</text><rect x="72" y="625" width="936" height="485" fill="#ffda35" stroke="none" stroke-width="2"/><text x="112" y="701" font-size="36" fill="#20231e" font-weight="700">选择主题，再复制订阅地址。</text><rect x="112" y="760" width="270" height="220" fill="#f6f4ed" stroke="none" stroke-width="2"/><rect x="405" y="760" width="270" height="220" fill="#f6f4ed" stroke="none" stroke-width="2"/><rect x="698" y="760" width="270" height="220" fill="#f6f4ed" stroke="none" stroke-width="2"/><text x="140" y="815" font-size="25" fill="#69705f" font-weight="400">01</text><text x="140" y="900" font-size="56" fill="#20231e" font-weight="700">早餐</text><text x="433" y="815" font-size="25" fill="#69705f" font-weight="400">02</text><text x="433" y="900" font-size="56" fill="#20231e" font-weight="700">咖啡</text><text x="726" y="815" font-size="25" fill="#69705f" font-weight="400">03</text><text x="726" y="900" font-size="43" fill="#20231e" font-weight="700">联名周边</text><text x="112" y="1050" font-size="29" fill="#20231e" font-weight="400">直接使用公开日历，无需自己配置 MCP</text><text x="72" y="1185" font-size="31" fill="#69705f" font-weight="400">少记一件事，把时间留给生活。</text><path d="M72 1240H1008" stroke="#69705f" stroke-width="2"/><text x="72" y="1293" font-size="25" fill="#69705f" font-weight="400">麦麦不忘 · 独立参赛作品 · 非麦当劳官方产品</text><text x="