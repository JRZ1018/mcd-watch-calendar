<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}</style><rect x="0" y="0" width="1080" height="1440" fill="#20231e" stroke="none" stroke-width="2"/><text x="72" y="100" font-size="28" fill="#ffda35" font-weight="400">01 / CHOOSE &amp; COPY</text><text x="72" y="270" font-size="88" fill="#f6f4ed" font-weight="700">喜欢哪一类，</text><text x="72" y="390" font-size="88" fill="#f6f4ed" font-weight="700">就订阅哪一类。</text><text x="72" y="515" font-size="36" fill="#c3c9b8" font-weight="400">在网页上选一个主题</text><rect x="72" y="580" width="210" height="86" fill="#ffda35" stroke="none" stroke-width="2"/><text x="123" y="638" font-size="34" fill="#20231e" font-weight="700">早餐</text><rect x="304" y="580" width="210" height="86" fill="#20231e" stroke="#8e9584" stroke-width="2"/><text x="355" y="638" font-size="34" fill="#f6f4ed" font-weight="400">咖啡</text><rect x="536" y="580" width="320" height="86" fill="#20231e" stroke="#8e9584" stroke-width="2"/><text x="581" y="638" font-size="34" fill="#f6f4ed" font-weight="400">联名周边</text><rect x="72" y="735" width="936" height="290" fill="#f6f4ed" stroke="none" stroke-width="2"/><text x="112" y="807" font-size="32" fill="#20231e" font-weight="400">当前订阅范围：早餐</text><rect x="112" y="850" width="420" height="100" fill="#20231e" stroke="none" stroke-width="2"/><text x="152" y="916" font-size="39" fill="#f6f4ed" font-weight="400">复制订阅地址</text><path d="M605 890l0 92 25-22 22 40 22-12-22-40 33-3z" fill="#ffda35" stroke="#20231e" stroke-width="3"/><text x="72" y="1120" font-size="32" fill="#f6f4ed" font-weight="400">主题切换，也会切换对应的订阅源。</text><text x="72" y="1180" font-size="27" fill="#c3c9b8" font-weight="400">搜索和日期开关仅影响网页列表。</text><path d="M72 1240H1008" stroke="#c3c9b8" stroke-width="2"/><text x="72" y="1293" font-size="25" fill="#c3c9b8" font-weight="400">麦麦不忘 · 独立参赛作品 · 非麦当劳官方产品</text><text x="72" y="1338" font-size="22" fill="#c3c9b8" font-weig