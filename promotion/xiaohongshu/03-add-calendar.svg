<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}</style><rect x="0" y="0" width="1080" height="1440" fill="#f6f4ed" stroke="none" stroke-width="2"/><text x="72" y="100" font-size="28" fill="#69705f" font-weight="400">02 / ADD TO YOUR CALENDAR</text><text x="72" y="270" font-size="88" fill="#20231e" font-weight="700">在你常用的</text><text x="72" y="390" font-size="88" fill="#20231e" font-weight="700">日历里添加。</text><text x="72" y="500" font-size="35" fill="#69705f" font-weight="400">选择支持 ICS 订阅的日历客户端</text><rect x="72" y="570" width="936" height="135" fill="#e9ebdf" stroke="none" stroke-width="2"/><text x="110" y="622" font-size="25" fill="#69705f" font-weight="400">01</text><text x="190" y="650" font-size="36" fill="#20231e" font-weight="700">找到「添加订阅日历」入口</text><rect x="72" y="730" width="936" height="135" fill="#ffda35" stroke="none" stroke-width="2"/><text x="110" y="782" font-size="25" fill="#20231e" font-weight="400">02</text><text x="190" y="810" font-size="36" fill="#20231e" font-weight="700">粘贴 HTTPS 订阅地址</text><rect x="72" y="890" width="936" height="135" fill="#e9ebdf" stroke="none" stroke-width="2"/><text x="110" y="942" font-size="25" fill="#69705f" font-weight="400">03</text><text x="190" y="970" font-size="36" fill="#20231e" font-weight="700">按需设置提醒与刷新偏好</text><text x="72" y="1100" font-size="29" fill="#20231e" font-weight="400">每六小时尝试更新，客户端刷新可能延迟。</text><text x="72" y="1150" font-size="27" fill="#69705f" font-weight="400">记录官方展示日期，不推断开售或截止日期。</text><text x="72" y="1198" font-size="24" fill="#69705f" font-weight="400">具体入口名称以日历客户端为准。</text><path d="M72 1240H1008" stroke="#69705f" stroke-width="2"/><text x="72" y="1293" font-size="25" fill="#69705f" font-weight="400">麦麦不忘 · 独立参赛作品 · 非麦当劳官方产品</text><text x="72" y="1338" font-size="22" fill="#69705f" font-weight="400">AI 辅助排版｜功能说明图，非手机日历实拍</text></svg>